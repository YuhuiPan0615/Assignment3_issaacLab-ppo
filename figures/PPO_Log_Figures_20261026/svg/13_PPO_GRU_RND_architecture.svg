    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(765.073575 458.827127)">+ weighted RND bonus</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #516174" x="413.5248" y="522.23328" transform="rotate(-0 413.5248 522.23328)">Original environment reward</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #435363" x="32.1984" y="574.24608" transform="rotate(-0 32.1984 574.24608)">GRU states reset at episode boundaries. Evaluation uses the deterministic actor and environment rewards only.</text>
   </g>
