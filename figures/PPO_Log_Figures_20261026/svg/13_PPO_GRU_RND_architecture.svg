   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(56.9112 246.839136)">Isaac Lab environment</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(67.051044 260.316479)">128 parallel rooms</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(113.9112 273.793823)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(70.734638 287.271167)">23-D observation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(66.965106 300.748511)">2-D velocity action</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(80.657294 314.225854)">30 Hz control</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(319.676894 180.170783)">Actor GRU</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(303.265956 193.648127)">128 hidden units</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(515.60665 180.170783)">Actor MLP: 256, 256 ELU</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(535.282431 193.648127)">Gaussian + tanh</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(319.79955 294.598943)">Critic GRU</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(303.265956 308.076287)">128 hidden units</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(515.729306 294.598943)">Critic MLP: 256, 256 ELU</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(539.628525 308.076287)">Value estimate</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(790.41863 209.994915)">PPO update</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(817.5492 222.528844)"/>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(777.761184 235.062774)">128 x 256 rollout</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(778.16152 247.596704)">GAE: 0.999, 0.98</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(783.169716 260.130633)">Clip ratio: 0.20</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(770.724427 272.664563)">5 epochs, 8 batches</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #516174" x="349.9704" y="95.72832" transform="rotate(-0 349.9704 95.72832)">Velocity action to environment</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(293.249306 425.902463)">RND target and predictor</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(303.829228 438.032073)">Both: 128, 128 ReLU</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(300.220088 450.161682)">32 prediction features</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(315.522197 462.291292)">Target is frozen</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(551.105128 425.902463)">Error / running RMS</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(537.366769 438.032073)">Cap normalised error at 5</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(540.4338 450.161682)">Beta = 0.005 x 0.999^k</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(547.998722 462.291292)">k = training iteration</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #66778a" x="227.4012" y="388.873162" transform="rotate(-0 227.4012 388.873162)">Next observation</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #243347" transform="translate(780.998653 434.567908)">Learning reward</text>
